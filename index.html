<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anura Cabs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🚖 Anura Cabs</h1>
    <p>Safe & Reliable Taxi Service in Sri Lanka</p>
</header>

<section class="hero">
    <h2>Book Your Taxi Today</h2>
    <p>Airport Transfers • City Tours • Long Distance Travel</p>

    <button class="btn" type="button" onclick="calculateFare()">
Book on WhatsApp
</button>
</section>

<section class="ction">
    <h2>Our Services</h2>

    <ul>
        <li>Airport Pickups</li>
        <li>City Taxi</li>
        <li>Long Distance Trips</li>
        <li>Tour Packages</li>
    </ul>
</section>
<section class="section">

<h2>Book Your Taxi</h2>

<input type="text" id="name" placeholder="Full Name" required><br><br>

<input type="tel" id="phone" placeholder="Phone Number" required><br><br>

<input type="email" id="email" placeholder="Email Address"><br><br>

<select id="vehicle" required>
  <option value="">Select Vehicle</option>
  <option>Car</option>
  <option>Mini Van</option>
  <option>Van</option>
  <option>SUV</option>
</select><br><br>

<input type="date" id="date" required><br><br>

<input type="time" id="time" required><br><br>

<button class="btn" onclick="bookTaxi()">Book on WhatsApp</button>
<label>Pickup Location</label><br>
<input type="text" id="pickup"><br><br>

<label>Destination</label><br>
<input type="text" id="destination"><br><br>

<label>Distance (KM)</label><br>
<input type="number" id="distance"><br><br>

<button class="btn" onclick="calculateFare()">Calculate Fare</button>

<h3 id="fare"></h3>
</section>
<footer>
    <p>© 2026 Anura Cabs | Sri Lanka</p>
</footer>

<script src="script.js"></script>

</body>
</html>
