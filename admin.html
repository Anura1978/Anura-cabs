<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anura Cabs - Admin Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .login-box {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🚖 Anura Cabs</h1>

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="loginBtn">
        Login
    </button>

    <div id="message"></div>
<div id="bookings"></div>
</div>

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    const firebaseConfig = {

        apiKey: "AIzaSyCjjzQn62zxY8ZvfCzFkIRHm8ioNHgo34E",

        authDomain: "anura-cabs.firebaseapp.com",

        projectId: "anura-cabs",

        storageBucket: "anura-cabs.firebasestorage.app",

        messagingSenderId: "636799292252",

        appId: "1:636799292252:web:0d57e77751c1a3179c6799"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    async function loadBookings() {
async function assignDriver(bookingId) {

    const driverName =
        document.getElementById(
            `driverName-${bookingId}`
        ).value.trim();

    const driverPhone =
        document.getElementById(
            `driverPhone-${bookingId}`
        ).value.trim();

    const vehicleNumber =
        document.getElementById(
            `vehicleNumber-${bookingId}`
        ).value.trim();


    if (!driverName || !driverPhone || !vehicleNumber) {

        alert(
            "Please enter Driver Name, Driver Phone and Vehicle Number."
        );

        return;
    }


    try {

        await updateDoc(
            doc(db, "bookings", bookingId),
            {
                Driver: driverName,
                DriverPhone: driverPhone,
                VehicleNumber: vehicleNumber,
                Status: "Assigned"
            }
        );


        alert("Driver assigned successfully!");


        await loadBookings();


    } catch (error) {

        console.error(
            "Driver assignment error:",
            error
        );

        alert(
            "Failed to assign driver."
        );

    }

}
        try {

            const querySnapshot =
                await getDocs(collection(db, "bookings"));

            const bookingsDiv =
                document.getElementById("bookings");

            bookingsDiv.innerHTML = "";


            querySnapshot.forEach((doc) => {

                const data = doc.data();


                bookingsDiv.innerHTML += `

                    <div style="
                        background:white;
                        padding:20px;
                        margin-top:20px;
                        border-radius:12px;
                        box-shadow:0 3px 10px rgba(0,0,0,0.1);
                    ">

                        <h3>
                            🚖 Booking ID: ${doc.id}
                        </h3>

                        <p>
                            <strong>Customer:</strong>
                            ${data.customer || ""}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${data.Phone || ""}
                        </p>

                        <p>
                            <strong>Vehicle:</strong>
                            ${data.Vehicle || ""}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${data.date || ""}
                        </p>

                        <p>
                            <strong>Time:</strong>
                            ${data.Time || ""}
                        </p>

                        <p>
                            <strong>Pickup:</strong>
                            ${data.pickup || ""}
                        </p>

                        <p>
                            <strong>Destination:</strong>
                            ${data.destination || ""}
                        </p>

                        <p>
                            <strong>Distance:</strong>
                            ${data.distance || ""} KM
                        </p>

                        <p>
                            <strong>Fare:</strong>
                            LKR ${data.Fare || ""}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${data.Status || ""}
                        </p>

                        <p>
                            <strong>Driver:</strong>
                            ${data.Driver || "Not assigned"}
                        </p>
<div style="margin-top:15px;">

    <input
        type="text"
        id="driverName-${doc.id}"
        placeholder="Driver Name"
    >

    <input
        type="tel"
        id="driverPhone-${doc.id}"
        placeholder="Driver Phone"
    >

    <input
        type="text"
        id="vehicleNumber-${doc.id}"
        placeholder="Vehicle Number"
    >

    <button
        onclick="assignDriver('${doc.id}')"
    >
        👨‍✈️ Assign Driver
    </button>

</div>
                    </div>

                `;

            });


        } catch (error) {

            console.error(
                "Firestore error:",
                error
            );

        }

    }


    document
        .getElementById("loginBtn")
        .addEventListener("click", async () => {


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document.getElementById("message");


            if (!email || !password) {

                message.textContent =
                    "Please enter email and password.";

                return;

            }


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                message.textContent =
                    "Login successful!";


                await loadBookings();


            } catch (error) {

                message.textContent =
                    error.code +
                    " - " +
                    error.message;

            }

        });

</script>



</body>
</html>
